# Serves dist from the edge, replacing the nginx container behind the tunnel.
# An assets-only Worker runs no script, so asset requests are never billed.
name = "h3nc4-portfolio"
compatibility_date = "2026-09-28"

# Off, so the site answers on its own hostnames and not on workers.dev too.
workers_dev = false

[assets]
directory = "./dist"

# Replaces `try_files $uri $uri/ /index.html`.
not_found_handling = "single-page-application"

# The apex also answers for the two files http-static used to serve, which now
# ship in public/ rather than out of a container of their own.
[[routes]]
pattern = "h3nc4.com"
custom_domain = true

[[routes]]
pattern = "www.h3nc4.com"
custom_domain = true
