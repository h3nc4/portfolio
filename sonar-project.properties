# Root project information
sonar.projectKey=portfolio
sonar.projectName=Portfolio
sonar.projectVersion=0.0.0
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=src
sonar.tests=src

# Test inclusions
sonar.test.inclusions=**/*.test.ts,src/test/**

# Exclusions
sonar.exclusions= \
  node_modules/**, \
  dist/**, \
  coverage-*, \
  src/components/ui/**, \
  .astro/**, \
  astro.config.ts, \
  vitest.config.ts, \
  vitest.config.browser.ts, \
  eslint.config.js, \
  tsconfig.json

# Coverage
sonar.javascript.lcov.reportPaths=coverage.lcov

# Exclude the entry point from coverage metrics, and .astro files, which no analyzer claims today
# but which coverage could never reach, since vitest measures only .ts.
sonar.coverage.exclusions=src/scripts/main.ts,**/*.astro
