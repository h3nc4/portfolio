name: Security Analysis

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'
  schedule:
    - cron: '23 3 * * *' # Daily at 03:23 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the fix branch
      pull-requests: write # opens the pull request
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
        with:
          base-sha: ''
      - name: Fix what can be fixed
        id: fix
        if: github.event_name != 'push'
        run: |
          $DEV_RUN -c 'npm audit fix --package-lock-only'
          if git diff --quiet -- package.json package-lock.json; then
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          fi
      - name: Lint, test and build the fixed tree
        if: steps.fix.outputs.changed == 'true'
        run: |
          $DEV_RUN -c '
            set -e
            npm ci
            npm run format:check
            npm run lint
            npm run lint:md
            npm run lint:sh
            npm run typecheck
            npm run test
            npm run build
          '
      - name: Open a pull request for the fix
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_BRANCH: security/audit-fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -qB "${FIX_BRANCH}"
          git commit -qm 'npm audit fix' -- package.json package-lock.json
          git push -qf origin "${FIX_BRANCH}"
          url="$(gh pr list --head "${FIX_BRANCH}" --base main --state open \
            --json url --jq '.[0].url // empty')"
          if [ -z "${url}" ]; then
            url="$(gh pr create --head "${FIX_BRANCH}" --base main \
              --title 'npm audit fix' \
              --body 'Opened by the nightly audit, with the suite already green on this tree.')"
          fi
          echo "::notice::the fix is waiting at ${url}"
      - name: Audit dependencies
        run: $DEV_RUN -c 'npm run audit'

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run github/codeql-action/init
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - name: Run actions/setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project for analysis
        run: npm run typecheck
      - name: Run github/codeql-action/analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:javascript-typescript'
