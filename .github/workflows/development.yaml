name: Portfolio Development CI

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@896daea2e2bdda063d6992243c634f156ce057ac # v1
        with:
          published-repo: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
      - name: Lint, test and build
        run: |
          $DEV_RUN -c '
            set -e
            npm ci
            npm run format:check
            npm run lint
            npm run lint:md
            npm run lint:sh
            npm run audit
            npm run typecheck
            npm run test
            npm run build
          '
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-coverage
          path: coverage.lcov
          retention-days: 1
      - name: Create Pages artifact tar
        if: github.ref == 'refs/heads/main'
        run: tar --format=ustar --no-same-owner -cf artifact.tar -C dist .
      - name: Run actions/upload-artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages
          path: artifact.tar

  browser-tests:
    name: Browser Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop Browsers
          - project: chromium
            install: chromium
          - project: firefox
            install: firefox
          - project: webkit
            install: webkit
          # Mobile Viewports
          - project: mobile-chrome
            install: chromium
          - project: mobile-safari
            install: webkit
          - project: pixel-7
            install: chromium
          - project: iphone-15
            install: webkit
          - project: ipad-pro
            install: webkit
          # Branded Desktop
          - project: google-chrome
            install: chrome
          - project: msedge
            install: msedge
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@896daea2e2bdda063d6992243c634f156ce057ac # v1
        with:
          published-repo: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev
          base-sha: ''
          docker-args: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -e HOME=/root --user 0:0 --shm-size=1gb
      - name: Run actions/cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
      - name: Install, install browsers and run the browser tests
        run: |
          $DEV_RUN -c '
            set -e
            npm ci
            npx playwright install --with-deps ${{ matrix.install }}
            npm run test:browser -- --project ${{ matrix.project }}
          '

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-coverage
      - name: Run SonarQube analysis
        run: ./scripts/sonar.sh

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Run actions/deploy-pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  build-test-container:
    name: Build and Test Runtime Container
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare metadata
        id: meta
        run: |
          echo "PUSH=${{ github.ref == 'refs/heads/main' }}" >>$GITHUB_OUTPUT
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >>$GITHUB_OUTPUT
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAGS=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest,${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:$SHORT_SHA" >>$GITHUB_OUTPUT
          else
            echo "TAGS=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest" >>$GITHUB_OUTPUT
          fi
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the published dev image tag
        id: dev_tag
        run: echo "tag=$(cat .github/VERSION)" >>"$GITHUB_OUTPUT"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: Build Container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ steps.meta.outputs.PUSH }}
          load: true
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            DEV_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev:${{ steps.dev_tag.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
      - name: Run container
        run: |
          CONTAINER_ID=$(docker run -d -p 8080:80 ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest)
          echo "CONTAINER_ID=$CONTAINER_ID" >>"$GITHUB_ENV"
      - name: Poll container url
        run: |
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:8080/ | grep -qi "henrique"; then
              echo "Container started successfully."
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 3
          done
          echo "Container did not start." >&2
          docker logs "$CONTAINER_ID" >&2
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_ID"
